# eFiscal QA - host Apache reverse proxy in front of docker-compose.qa.yml.
#
# Install:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo cp deploy/apache/efiscal-qa.conf /etc/apache2/sites-available/efiscal-qa.conf
#   (replace qa.efiscal.example.com below with the real QA host name)
#   sudo a2ensite efiscal-qa && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache --redirect -d qa.efiscal.example.com
#
# certbot copies this vhost into efiscal-qa-le-ssl.conf (port 443, with its certificate paths)
# and turns this port-80 vhost into a redirect to HTTPS. Keep proxy changes in both files afterwards.

<VirtualHost *:80>
    ServerName qa.efiscal.example.com

    ErrorLog ${APACHE_LOG_DIR}/efiscal-qa-error.log
    CustomLog ${APACHE_LOG_DIR}/efiscal-qa-access.log combined

    # Let's Encrypt HTTP-01 challenge must not be proxied to the frontend container.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 3600

    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Product sync streams Server-Sent Events; compression/buffering would stall live progress.
    SetEnvIf Request_URI "^/api/v1/products/sync" no-gzip=1

    # Backend API (order matters: /api/ must come before /).
    # Ports must match EFISCAL_BACKEND_PORT / EFISCAL_FRONTEND_PORT in .env (defaults 8090 / 8091).
    ProxyPass        /api/ http://127.0.0.1:8090/api/ flushpackets=on timeout=3600
    ProxyPassReverse /api/ http://127.0.0.1:8090/api/

    # Static React app (nginx container).
    ProxyPass        / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/
</VirtualHost>
