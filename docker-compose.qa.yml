# QA/production-style stack. Usage (from repo root, with a filled-in .env):
#   docker compose -f docker-compose.qa.yml --env-file .env up -d --build
# All ports are bound to 127.0.0.1; public traffic goes through host Apache (deploy/apache/efiscal-qa.conf).
# Host ports default to 8090 (backend) / 8091 (frontend); if changed in .env, update the Apache vhost to match.
name: efiscal-qa

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Europe/Belgrade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - efiscal_pg_qa:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Belgrade
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m}
    ports:
      - "127.0.0.1:${EFISCAL_BACKEND_PORT:-8090}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${EFISCAL_FRONTEND_PORT:-8091}:80"

volumes:
  efiscal_pg_qa:
