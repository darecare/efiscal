server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: efiscal-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/efiscal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: false

app:
  manufacturer: ${APP_MANUFACTURER:eFiscal}
  serial-number: ${APP_SERIAL_NUMBER:EFISCAL-VPS-001}
  software-version: ${APP_SOFTWARE_VERSION:0.0.1-SNAPSHOT}
